<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request help</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><span id="room"></span></header>

<main class="student">
  <section id="v-form">
    <h1>Need help?</h1>
    <p class="lede">Type your name and send a request. Your teacher sees it right away.</p>
    <form id="f" novalidate>
      <label>Your name <input id="name" maxlength="40" autocomplete="given-name"></label>
      <button class="primary" id="send" type="submit">Request help</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section id="v-sent" hidden aria-live="polite">
    <p class="sent-mark" aria-hidden="true">✋</p>
    <h1 id="sent-title">Your teacher got your request</h1>
    <p class="lede">Keep working on what you can. When you’ve been helped, or you figure it out yourself, tap the button below.</p>
    <button id="done" class="secondary">I’m all set</button>
  </section>
</main>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="student.js"></script>
</body>
</html>
